<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Interaktif</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="kotak">
    <header class="kepala">
      <h1 class="judul">Kuis Interaktif</h1>
      <button id="tombol-tema" class="tombol-tema">Mode Terang</button>
    </header>

    <section id="layar-awal" class="layar">
      <p class="deskripsi">Uji pengetahuan dasar pemrograman web dengan 8 soal pilihan ganda. Setiap soal punya waktu 20 detik.</p>
      <div class="papan-rekor">
        <span class="label-rekor">Skor Tertinggi</span>
        <span id="rekor-awal" class="angka-rekor">0</span>
      </div>
      <button id="tombol-mulai" class="tombol-utama">Mulai Kuis</button>
    </section>

    <section id="layar-kuis" class="layar sembunyi">
      <div class="baris-atas">
        <span id="info-soal" class="info">Soal 1 dari 8</span>
        <span class="info">Skor: <span id="info-skor">0</span></span>
      </div>
      <div class="wadah-progress">
        <div id="progress-isi" class="progress-isi"></div>
      </div>
      <div class="baris-timer">
        <span id="kategori-soal" class="kategori">HTML</span>
        <span id="info-timer" class="timer">20s</span>
      </div>
      <div id="wadah-pertanyaan" class="wadah-pertanyaan"></div>
      <p id="pesan-jawaban" class="pesan"></p>
      <button id="tombol-lanjut" class="tombol-utama sembunyi">Soal Berikutnya</button>
    </section>

    <section id="layar-hasil" class="layar sembunyi">
      <h2 class="judul-hasil">Kuis Selesai</h2>
      <div class="papan-hasil">
        <div class="kotak-hasil">
          <span class="label-hasil">Jawaban Benar</span>
          <span id="jumlah-benar" class="angka-hasil">0</span>
        </div>
        <div class="kotak-hasil">
          <span class="label-hasil">Skor Akhir</span>
          <span id="skor-akhir" class="angka-hasil">0</span>
        </div>
        <div class="kotak-hasil">
          <span class="label-hasil">Skor Tertinggi</span>
          <span id="rekor-akhir" class="angka-hasil">0</span>
        </div>
      </div>
      <p id="pesan-rekor" class="pesan"></p>
      <p id="rincian-jawaban" class="rincian"></p>
      <button id="tombol-ulang" class="tombol-utama">Main Lagi</button>
      <button id="tombol-reset" class="tombol-biasa">Reset Skor Tertinggi</button>
    </section>
  </main>
  <script src="js/soal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
